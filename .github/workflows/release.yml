name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build Hop distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run script tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build distributions
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          target_args=()
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            target_args+=(--target windows-x86_64)
          fi
          python3 scripts/build_hop_distribution.py \
            --hop-version 2.17.0 \
            --plugin-release latest \
            --geometry-inspector-release latest \
            --geoprocessing-release latest \
            --geometry-calculator-release latest \
            --ili2db-release latest \
            --ilivalidator-release latest \
            "${target_args[@]}" \
            --output-dir dist
          ls -lah dist

      - name: Enable FFM native access in Hop launchers
        run: |
          set -euo pipefail
          python3 scripts/patch_hop_launchers.py dist/*.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hop-distributions
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/release-metadata.json

      - name: Upload Windows distribution for smoke test
        uses: actions/upload-artifact@v4
        with:
          name: hop-distribution-windows-x86_64
          if-no-files-found: error
          compression-level: 0
          path: dist/*-windows-x86_64.zip

  windows-smoke:
    name: Windows OGR end-to-end smoke
    runs-on: windows-2025
    needs: package

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "23"

      - name: Download Windows distribution
        uses: actions/download-artifact@v4
        with:
          name: hop-distribution-windows-x86_64
          path: dist

      - name: Run OGR pipeline twice
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path dist -Filter '*-windows-x86_64.zip' | Select-Object -First 1
          if (-not $zip) {
            throw "Windows distribution ZIP not found"
          }
          ./scripts/windows_ogr_smoke.ps1 -DistributionZip $zip.FullName

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs:
      - package
      - windows-smoke
    if: github.event_name != 'pull_request'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: hop-distributions
          path: dist

      - name: Prepare release metadata
        id: metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path("dist/release-metadata.json").read_text(encoding="utf-8"))
          body_lines = [
              f"Commit: `{metadata['commit_sha']}`" if metadata.get("commit_sha") else "Commit: local/manual run",
              f"Apache Hop: `{metadata['hop_version']}`",
              f"hop-gdal-plugin: `{metadata['plugin_release_tag']}`",
              f"hop-geometry-inspector-plugin: `{metadata['geometry_inspector_release_tag']}`",
              f"hop-ili2db-plugin: `{metadata['ili2db_release_tag']}`",
              f"hop-ilivalidator-plugin: `{metadata['ilivalidator_release_tag']}`",
              f"hop-geoprocessing-plugin: `{metadata['geoprocessing_release_tag']}`",
              f"hop-geometry-calculator-plugin: `{metadata['geometry_calculator_release_tag']}`",
              "",
              "Assets:",
          ]
          body_lines.extend(f"- `{artifact['file']}`" for artifact in metadata["artifacts"])
          body = "\n".join(body_lines) + "\n"
          Path("dist/release-body.md").write_text(body, encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"tag_name={metadata['release_tag']}\n")
              handle.write(f"release_name={metadata['release_name']}\n")
          PY

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.metadata.outputs.release_name }}
          draft: false
          prerelease: false
          overwrite_files: true
          body_path: dist/release-body.md
          files: dist/*.zip
