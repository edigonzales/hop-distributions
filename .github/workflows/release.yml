name: Release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test builder
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build one distribution from current snapshots
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python scripts/build_hop_distribution.py --output-dir dist
          python scripts/check_geotools_versions.py --expected-version 35.1 dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hop-distribution
          compression-level: 0
          if-no-files-found: error
          path: dist/
  e2e:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        java: ['21', '25']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v4
        with:
          name: hop-distribution
          path: dist
      - name: Test the packaged distribution (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/run_ci_e2e.py
      - name: Test the packaged distribution (macOS/Windows)
        if: runner.os != 'Linux'
        run: python scripts/run_ci_e2e.py
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.os }}-java${{ matrix.java }}
          path: .ci/e2e/reports
  release:
    needs: [package, e2e]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hop-distribution
          path: dist
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/publish_release.py
